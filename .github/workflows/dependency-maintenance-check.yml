name: Dependency maintenance check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m py_compile liturgie_app.py
      - name: Synthetic PDF and Excel smoke test
        run: |
          python - <<'PY'
          import io, zipfile
          import streamlit, requests, docx, xlsxwriter, reportlab
          from reportlab.pdfgen import canvas
          from reportlab.platypus import SimpleDocTemplate, Table
          assert xlsxwriter.__version__ == '3.3.4'
          assert reportlab.Version == '5.1.1'
          rows = [['Lecteur', 'Présence'], ['Échantillon', 'Éligible']]
          x = io.BytesIO()
          with xlsxwriter.Workbook(x, {'in_memory': True}) as w:
              s = w.add_worksheet()
              for i, row in enumerate(rows):
                  s.write_row(i, 0, row)
          with zipfile.ZipFile(x) as z:
              assert z.testzip() is None
              assert 'xl/worksheets/sheet1.xml' in z.namelist()
          p = io.BytesIO()
          SimpleDocTemplate(p).build([Table(rows)])
          assert p.getvalue().startswith(b'%PDF-')
          assert b'%%EOF' in p.getvalue()[-32:]
          print('Synthetic exports passed; no production data accessed.')
          PY
