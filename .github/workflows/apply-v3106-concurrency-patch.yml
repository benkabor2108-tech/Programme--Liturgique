name: Apply v3.10.6 concurrency patch

on:
  push:
    branches: [feature/v3.10.6-concurrency-work]
    paths:
      - ".github/workflows/apply-v3106-concurrency-patch.yml"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v3.10.6-concurrency-work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install minimal test dependency
        run: python -m pip install requests

      - name: Apply guarded source patch
        run: python scripts/apply_v3106_concurrency_patch.py

      - name: Compile changed Python files
        run: |
          python -m py_compile state_store.py
          python -m py_compile liturgie_app.py
          python -m py_compile liturgical_drafts_ui.py
          python -m py_compile scripts/liturgical_drafts_automation.py
          python -m py_compile scripts/whatsapp_automation.py

      - name: Run concurrency and history tests
        run: |
          python -m unittest tests/test_state_store.py -v
          python -m unittest tests/test_history_protection.py -v

      - name: Validate diff
        run: git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liturgie_app.py liturgical_drafts_ui.py scripts/liturgical_drafts_automation.py scripts/whatsapp_automation.py .github/workflows/ci.yml tests/test_history_protection.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat: protect concurrent Supabase writes"
          git push origin HEAD:feature/v3.10.6-concurrency-work
