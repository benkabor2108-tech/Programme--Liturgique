name: WhatsApp reminders

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/whatsapp-reminders.yml"
  schedule:
    # Premier passage à 18 h 30, puis nouvelles tentatives jusqu'à 23 h 45.
    # Ouagadougou est en UTC+0 toute l'année.
    - cron: "30,45 18 * * 3,5"
    - cron: "*/15 19-23 * * 3,5"
  workflow_dispatch:
    inputs:
      reminder_kind:
        description: "Rappel à simuler/exécuter"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - mercredi
          - vendredi
      dry_run:
        description: "Simulation sans envoi Meta"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: whatsapp-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install minimal dependency
        run: python -m pip install requests

      - name: Compile automation runner
        run: python -m py_compile scripts/whatsapp_automation.py

      - name: Run reminder engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_STATE_KEY: ${{ secrets.SUPABASE_STATE_KEY }}
          # Paramètres non sensibles figés ici pour éviter des secrets GitHub inutiles.
          WHATSAPP_GRAPH_API_VERSION: "v25.0"
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_WEDNESDAY: "rappel_liturgie_mercredi"
          WHATSAPP_TEMPLATE_FRIDAY: "rappel_liturgie_vendredi"
          WHATSAPP_TEMPLATE_LANGUAGE: "fr"
          # Activation définitive après approbation Meta des deux modèles.
          WHATSAPP_AUTOMATION_ENABLED: "true"
          WHATSAPP_REMINDER_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.reminder_kind || 'auto' }}
          WHATSAPP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail
          raw="${SUPABASE_URL%/}"
          raw="${raw#\"}"
          raw="${raw%\"}"
          raw="${raw#\'}"
          raw="${raw%\'}"
          case "$raw" in
            http://*|https://*)
              export SUPABASE_URL="$raw"
              ;;
            *.supabase.co)
              export SUPABASE_URL="https://$raw"
              ;;
            *.*)
              export SUPABASE_URL="https://$raw"
              ;;
            *)
              export SUPABASE_URL="https://$raw.supabase.co"
              ;;
          esac
          python scripts/whatsapp_automation.py
