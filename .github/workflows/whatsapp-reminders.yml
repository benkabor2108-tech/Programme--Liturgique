name: WhatsApp reminders

on:
  schedule:
    - cron: "30 18 * * 3"
    - cron: "30 18 * * 5"
  workflow_dispatch:
    inputs:
      reminder_kind:
        description: "Rappel à simuler/exécuter"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - mercredi
          - vendredi
      dry_run:
        description: "Simulation sans envoi Meta"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: whatsapp-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install minimal dependency
        run: python -m pip install requests

      - name: Compile automation runner
        run: python -m py_compile scripts/whatsapp_automation.py

      - name: Run reminder engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_STATE_KEY: ${{ secrets.SUPABASE_STATE_KEY }}
          WHATSAPP_GRAPH_API_VERSION: ${{ secrets.WHATSAPP_GRAPH_API_VERSION }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_WEDNESDAY: ${{ secrets.WHATSAPP_TEMPLATE_WEDNESDAY }}
          WHATSAPP_TEMPLATE_FRIDAY: ${{ secrets.WHATSAPP_TEMPLATE_FRIDAY }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_AUTOMATION_ENABLED: ${{ secrets.WHATSAPP_AUTOMATION_ENABLED }}
          WHATSAPP_REMINDER_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.reminder_kind || 'auto' }}
          WHATSAPP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/whatsapp_automation.py
