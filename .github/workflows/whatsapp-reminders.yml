name: WhatsApp reminders

on:
  schedule:
    # Premier passage à 18 h 30, puis nouvelles tentatives jusqu'à 23 h 45.
    # Ouagadougou est en UTC+0 toute l'année.
    - cron: "30,45 18 * * 3,5"
    - cron: "*/15 19-23 * * 3,5"
  workflow_dispatch:
    inputs:
      reminder_kind:
        description: "Rappel à simuler/exécuter"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - mercredi
          - vendredi
      dry_run:
        description: "Simulation sans envoi Meta"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: whatsapp-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install minimal dependency
        run: python -m pip install requests

      - name: Compile automation runners
        run: |
          python -m py_compile scripts/whatsapp_automation.py
          python -m py_compile scripts/whatsapp_global_readiness.py

      - name: Run reminder engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_STATE_KEY: ${{ secrets.SUPABASE_STATE_KEY }}
          # Paramètres non sensibles figés ici pour éviter des secrets GitHub inutiles.
          WHATSAPP_GRAPH_API_VERSION: "v25.0"
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_WEDNESDAY: "rappel_liturgie_mercredi"
          WHATSAPP_TEMPLATE_FRIDAY: "rappel_liturgie_vendredi"
          WHATSAPP_TEMPLATE_LANGUAGE: "fr"
          # v3.10.11 : l'envoi reste en pause. Si ce verrou passe un jour à true,
          # le gate global ci-dessous exige que TOUS les programmes futurs actifs
          # soient entièrement prêts avant le moindre envoi de production.
          WHATSAPP_AUTOMATION_ENABLED: "false"
          WHATSAPP_REMINDER_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.reminder_kind || 'auto' }}
          WHATSAPP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          set -euo pipefail

          strip_outer_quotes() {
            local value="$1"
            value="${value#\"}"
            value="${value%\"}"
            value="${value#\'}"
            value="${value%\'}"
            printf '%s' "$value"
          }

          raw="$(strip_outer_quotes "${SUPABASE_URL%/}")"
          export SUPABASE_API_KEY="$(strip_outer_quotes "$SUPABASE_API_KEY")"
          export SUPABASE_STATE_KEY="$(strip_outer_quotes "$SUPABASE_STATE_KEY")"
          export WHATSAPP_PHONE_NUMBER_ID="$(strip_outer_quotes "$WHATSAPP_PHONE_NUMBER_ID")"
          export WHATSAPP_ACCESS_TOKEN="$(strip_outer_quotes "$WHATSAPP_ACCESS_TOKEN")"

          case "$raw" in
            http://*|https://*)
              export SUPABASE_URL="$raw"
              ;;
            *.supabase.co)
              export SUPABASE_URL="https://$raw"
              ;;
            *.*)
              export SUPABASE_URL="https://$raw"
              ;;
            *)
              export SUPABASE_URL="https://$raw.supabase.co"
              ;;
          esac

          enabled="$(printf '%s' "$WHATSAPP_AUTOMATION_ENABLED" | tr '[:upper:]' '[:lower:]')"
          dry_run="$(printf '%s' "$WHATSAPP_DRY_RUN" | tr '[:upper:]' '[:lower:]')"
          if [[ "$enabled" == "true" && "$dry_run" != "true" ]]; then
            echo "[gate] Vérification globale obligatoire avant envoi de production."
            python scripts/whatsapp_global_readiness.py
          fi

          python scripts/whatsapp_automation.py
