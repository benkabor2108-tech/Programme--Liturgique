name: Apply v3.10.16 weekend reminders version

on:
  push:
    branches:
      - feature/v3.10.16-weekend-whatsapp-reminders
    paths:
      - .github/workflows/_apply_v31016_version.yml
      - scripts/whatsapp_automation.py
      - tests/test_whatsapp_automation.py
      - tests/test_whatsapp_ui_guards.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v3.10.16-weekend-whatsapp-reminders
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Bump wrapper version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('liturgie_app.py')
          text = path.read_text(encoding='utf-8')
          old = '2026.09.15-persistant-supabase-v3.10.15-weekend-whatsapp-readiness'
          new = '2026.09.15-persistant-supabase-v3.10.16-weekend-whatsapp-reminders'
          if text.count(old) != 1:
              raise SystemExit(f'Version marker inattendu: {text.count(old)} occurrence(s)')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile changed surfaces
        run: |
          python -m py_compile liturgie_app.py
          python -m py_compile scripts/whatsapp_automation.py
          python -m py_compile scripts/whatsapp_global_readiness.py

      - name: Run WhatsApp regression tests
        run: |
          python -m unittest tests/test_whatsapp_automation.py -v
          python -m unittest tests/test_whatsapp_contact_readiness.py -v
          python -m unittest tests/test_whatsapp_global_readiness.py -v
          python -m unittest tests/test_whatsapp_ui_guards.py -v
          python -m unittest tests/test_state_store.py -v
          python -m unittest tests/test_history_protection.py -v
          python -m unittest tests/test_role_guards.py -v

      - name: Verify clean patch
        run: git diff --check

      - name: Commit validated wrapper version
        run: |
          git config user.name "benkabor2108-tech"
          git config user.email "benkabor2108@gmail.com"
          git add liturgie_app.py
          if git diff --cached --quiet; then
            echo "No wrapper change to commit."
          else
            git commit -m "chore: mark v3.10.16 weekend WhatsApp reminders"
            git push origin HEAD:feature/v3.10.16-weekend-whatsapp-reminders
          fi
