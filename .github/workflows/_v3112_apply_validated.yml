name: v3.10.12 apply validated patch

on:
  push:
    branches:
      - feature/v3.10.12-whatsapp-admin-activation
    paths:
      - .github/workflows/_v3112_apply_validated.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.10.12-whatsapp-admin-activation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply already validated patch
        run: |
          python scripts/_fix_patch_v3112.py
          python scripts/_fix_patch_v3112_guide.py
          python scripts/_fix_patch_v3112_encoding.py
          python scripts/_patch_v3112.py
      - name: Install minimal dependencies
        run: python -m pip install requests streamlit
      - name: Revalidate before commit
        run: |
          python -m py_compile liturgie_app.py scripts/whatsapp_automation.py scripts/whatsapp_global_readiness.py
          python -m unittest tests/test_whatsapp_automation.py -v
          python -m unittest tests/test_whatsapp_global_readiness.py -v
          python -m unittest tests/test_whatsapp_contact_readiness.py -v
          python -m unittest tests/test_state_store.py -v
          python -m unittest tests/test_history_protection.py -v
          python -m unittest tests/test_role_guards.py -v
      - name: Commit only validated product files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liturgie_app.py scripts/whatsapp_automation.py scripts/whatsapp_global_readiness.py tests/test_whatsapp_automation.py tests/test_whatsapp_global_readiness.py tests/test_whatsapp_ui_guards.py
          git commit -m "feat: add principal-controlled WhatsApp automation authorization"
          git push origin HEAD:feature/v3.10.12-whatsapp-admin-activation
