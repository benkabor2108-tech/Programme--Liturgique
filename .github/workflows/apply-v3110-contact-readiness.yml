name: Apply v3.10.10 contact readiness

on:
  push:
    branches:
      - feature/v3.10.10-whatsapp-contact-readiness-final8
    paths:
      - scripts/_patch_v3110.py
      - .github/workflows/apply-v3110-contact-readiness.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v3.10.10-whatsapp-contact-readiness-final8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply guarded wrapper patch
        run: python scripts/_patch_v3110.py

      - name: Compile changed code
        run: |
          python -m py_compile liturgie_app.py
          python -m py_compile whatsapp_readiness.py
          python -m py_compile tests/test_whatsapp_contact_readiness.py

      - name: Validate runtime transformation and readiness tests
        run: |
          python -m unittest tests/test_whatsapp_contact_readiness.py -v
          python -m unittest tests/test_whatsapp_ui_guards.py -v
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('liturgie_app.py').read_text(encoding='utf-8')
          ast.parse(source)
          assert 'v3.10.10-whatsapp-contact-readiness' in source
          assert "Préparation à l'automatisation WhatsApp" in source
          assert 'future_readiness_rows' in source
          assert 'whatsapp_display_rows' in source
          print('wrapper guard PASS')
          PY

      - name: Commit validated application changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liturgie_app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: show WhatsApp contact readiness in admin UI"
          git push origin HEAD:feature/v3.10.10-whatsapp-contact-readiness-final8
