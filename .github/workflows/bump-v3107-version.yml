name: Bump v3.10.7 version marker

on:
  push:
    branches:
      - feature/v3.10.7-supabase-hardening
    paths:
      - .github/workflows/bump-v3107-version.yml

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v3.10.7-supabase-hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Update version marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("liturgie_app.py")
          text = path.read_text(encoding="utf-8")
          old = 'APP_VERSION_OVERRIDE = "2026.09.15-persistant-supabase-v3.10.6-concurrency-protected"'
          new = 'APP_VERSION_OVERRIDE = "2026.09.15-persistant-supabase-v3.10.7-supabase-hardened"'
          if text.count(old) != 1:
              raise SystemExit(f"Version marker mismatch: expected 1 occurrence, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Compile wrapper
        run: python -m py_compile liturgie_app.py

      - name: Commit validated version marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liturgie_app.py
          git commit -m "chore: mark v3.10.7 Supabase hardening"
          git push origin HEAD:feature/v3.10.7-supabase-hardening
