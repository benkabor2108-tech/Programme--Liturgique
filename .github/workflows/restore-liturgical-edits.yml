name: Restore liturgical edits

on:
  push:
    paths:
      - "scripts/restore_liturgical_edits_2026_09_13.py"
      - ".github/workflows/restore-liturgical-edits.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-liturgical-edits-2026-09-13
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependency
        run: python -m pip install requests
      - name: Compile restore script
        run: python -m py_compile scripts/restore_liturgical_edits_2026_09_13.py
      - name: Restore draft edits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_STATE_KEY: ${{ secrets.SUPABASE_STATE_KEY }}
        run: python scripts/restore_liturgical_edits_2026_09_13.py
