name: Apply v3.10.9 WhatsApp readiness

on:
  push:
    branches:
      - feature/v3.10.9-whatsapp-readiness
    paths:
      - scripts/_patch_v3109.py
      - .github/workflows/apply-v3109-whatsapp-readiness.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v3.10.9-whatsapp-readiness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply guarded source patch
        run: python scripts/_patch_v3109.py

      - name: Compile changed Python files
        run: |
          python -m py_compile liturgie_app.py
          python -m py_compile liturgie_app_core.py
          python -m py_compile scripts/whatsapp_automation.py
          python -m py_compile tests/test_whatsapp_automation.py

      - name: Run WhatsApp and existing safety tests
        run: |
          python -m unittest tests/test_whatsapp_automation.py -v
          python -m unittest tests/test_history_protection.py -v
          python -m unittest tests/test_state_store.py -v
          python -m unittest tests/test_role_guards.py -v

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liturgie_app.py liturgie_app_core.py scripts/whatsapp_automation.py WHATSAPP_AUTOMATION_SETUP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: harden WhatsApp readiness gate"
          git push origin HEAD:feature/v3.10.9-whatsapp-readiness
