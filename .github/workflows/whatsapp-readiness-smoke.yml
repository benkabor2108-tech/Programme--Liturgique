name: WhatsApp readiness smoke

on:
  push:
    branches:
      - test/v3.10.8-whatsapp-readiness
    paths:
      - .github/workflows/whatsapp-readiness-smoke.yml

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requests
        run: python -m pip install requests

      - name: Validate Meta credentials without sending
        env:
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          phone_id = os.environ.get("WHATSAPP_PHONE_NUMBER_ID", "").strip().strip('"').strip("'")
          token = os.environ.get("WHATSAPP_ACCESS_TOKEN", "").strip().strip('"').strip("'")
          if not phone_id or not token:
              raise SystemExit("Meta credentials missing")
          url = f"https://graph.facebook.com/v25.0/{phone_id}"
          response = requests.get(
              url,
              params={"fields": "verified_name"},
              headers={"Authorization": f"Bearer {token}"},
              timeout=25,
          )
          print("meta_phone_endpoint_status", response.status_code)
          if not response.ok:
              raise SystemExit(f"Meta phone endpoint failed with HTTP {response.status_code}")
          data = response.json()
          print("meta_verified_name_present", bool(isinstance(data, dict) and data.get("verified_name")))
          PY

      - name: Discover WABA and inspect template approvals
        env:
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          phone_id = os.environ.get("WHATSAPP_PHONE_NUMBER_ID", "").strip().strip('"').strip("'")
          token = os.environ.get("WHATSAPP_ACCESS_TOKEN", "").strip().strip('"').strip("'")
          headers = {"Authorization": f"Bearer {token}"}
          probe = requests.get(
              f"https://graph.facebook.com/v25.0/{phone_id}",
              params={"fields": "whatsapp_business_account"},
              headers=headers,
              timeout=25,
          )
          print("waba_discovery_status", probe.status_code)
          if not probe.ok:
              print("waba_discovery_supported", False)
              raise SystemExit(0)
          data = probe.json()
          waba = data.get("whatsapp_business_account") if isinstance(data, dict) else None
          waba_id = waba.get("id") if isinstance(waba, dict) else ""
          print("waba_discovery_supported", bool(waba_id))
          if not waba_id:
              raise SystemExit(0)
          response = requests.get(
              f"https://graph.facebook.com/v25.0/{waba_id}/message_templates",
              params={"fields": "name,status,language", "limit": 100},
              headers=headers,
              timeout=25,
          )
          print("template_list_status", response.status_code)
          if not response.ok:
              raise SystemExit(0)
          rows = response.json().get("data", [])
          wanted = {"rappel_liturgie_mercredi", "rappel_liturgie_vendredi"}
          found = {
              str(item.get("name")): (str(item.get("status")), str(item.get("language")))
              for item in rows if str(item.get("name")) in wanted
          }
          for name in sorted(wanted):
              status, language = found.get(name, ("MISSING", ""))
              print(f"template_{name}_status", status)
              print(f"template_{name}_language", language or "UNKNOWN")
          PY

      - name: Dry-run all October reminder dates
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_STATE_KEY: ${{ secrets.SUPABASE_STATE_KEY }}
          WHATSAPP_GRAPH_API_VERSION: "v25.0"
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_TEMPLATE_WEDNESDAY: "rappel_liturgie_mercredi"
          WHATSAPP_TEMPLATE_FRIDAY: "rappel_liturgie_vendredi"
          WHATSAPP_TEMPLATE_LANGUAGE: "fr"
          WHATSAPP_AUTOMATION_ENABLED: "false"
          WHATSAPP_DRY_RUN: "true"
        shell: bash
        run: |
          set -euo pipefail
          strip_outer_quotes() {
            local value="$1"
            value="${value#\"}"
            value="${value%\"}"
            value="${value#\'}"
            value="${value%\'}"
            printf '%s' "$value"
          }
          raw="$(strip_outer_quotes "${SUPABASE_URL%/}")"
          export SUPABASE_API_KEY="$(strip_outer_quotes "$SUPABASE_API_KEY")"
          export SUPABASE_STATE_KEY="$(strip_outer_quotes "$SUPABASE_STATE_KEY")"
          case "$raw" in
            http://*|https://*) export SUPABASE_URL="$raw" ;;
            *.supabase.co) export SUPABASE_URL="https://$raw" ;;
            *.*) export SUPABASE_URL="https://$raw" ;;
            *) export SUPABASE_URL="https://$raw.supabase.co" ;;
          esac

          python scripts/whatsapp_automation.py --kind mercredi --reference-date 2026-09-30
          python scripts/whatsapp_automation.py --kind vendredi --reference-date 2026-10-02
          python scripts/whatsapp_automation.py --kind mercredi --reference-date 2026-10-07
          python scripts/whatsapp_automation.py --kind vendredi --reference-date 2026-10-09
          python scripts/whatsapp_automation.py --kind mercredi --reference-date 2026-10-14
          python scripts/whatsapp_automation.py --kind vendredi --reference-date 2026-10-16
          python scripts/whatsapp_automation.py --kind mercredi --reference-date 2026-10-21
          python scripts/whatsapp_automation.py --kind vendredi --reference-date 2026-10-23
