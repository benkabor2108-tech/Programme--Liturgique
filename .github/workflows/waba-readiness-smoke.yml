name: WABA readiness smoke

on:
  push:
    branches:
      - test/v3.10.9-waba-readiness
    paths:
      - .github/workflows/waba-readiness-smoke.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requests
        run: python -m pip install requests

      - name: Inspect WABA templates without sending
        env:
          WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          waba_id = os.environ.get("WHATSAPP_WABA_ID", "").strip().strip('"').strip("'")
          token = os.environ.get("WHATSAPP_ACCESS_TOKEN", "").strip().strip('"').strip("'")
          print("waba_secret_present", bool(waba_id))
          print("access_token_present", bool(token))
          if not waba_id or not token:
              raise SystemExit(0)

          response = requests.get(
              f"https://graph.facebook.com/v25.0/{waba_id}/message_templates",
              params={"fields": "name,status,language", "limit": 100},
              headers={"Authorization": f"Bearer {token}"},
              timeout=25,
          )
          print("template_list_status", response.status_code)
          if not response.ok:
              raise SystemExit(0)

          rows = response.json().get("data", [])
          wanted = {"rappel_liturgie_mercredi", "rappel_liturgie_vendredi"}
          found = {
              str(item.get("name")): (str(item.get("status")), str(item.get("language")))
              for item in rows if str(item.get("name")) in wanted
          }
          for name in sorted(wanted):
              status, language = found.get(name, ("MISSING", ""))
              print(f"template_{name}_status", status)
              print(f"template_{name}_language", language or "UNKNOWN")
          PY
