name: v3.10.7 production smoke

on:
  push:
    branches:
      - test/v3.10.7-production-smoke
    paths:
      - .github/workflows/v3107-production-smoke.yml

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requests
        run: python -m pip install requests

      - name: Check Streamlit public endpoint
        run: |
          python - <<'PY'
          import requests
          url = "https://programme--liturgique-e39juey35cfq23az2qvup5.streamlit.app/"
          r = requests.get(url, timeout=30, allow_redirects=True)
          print("streamlit_status", r.status_code)
          print("streamlit_final_url", r.url)
          if r.status_code >= 500:
              raise SystemExit(f"Streamlit endpoint returned {r.status_code}")
          PY

      - name: Exercise optimistic concurrency against isolated row
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_STATE_KEY: ${{ secrets.SUPABASE_STATE_KEY }}
          SMOKE_STATE_KEY: __smoke_v3107_20260915_0853
        run: |
          python - <<'PY'
          import os
          from state_store import (
              StateConflictError,
              load_state_record,
              save_state_if_revision,
          )

          url = os.environ["SUPABASE_URL"].strip().strip('"').strip("'")
          key = os.environ["SUPABASE_API_KEY"].strip().strip('"').strip("'")
          prod_key = os.environ["SUPABASE_STATE_KEY"].strip().strip('"').strip("'")
          smoke_key = os.environ["SMOKE_STATE_KEY"]

          initial, revision, _ = load_state_record(url, key, smoke_key)
          assert initial == {"smoke": "initial"}, initial
          assert revision == 0, revision

          next_revision = save_state_if_revision(
              url, key, smoke_key, {"smoke": "writer1", "step": 1}, revision
          )
          assert next_revision == 1, next_revision

          conflict_seen = False
          try:
              save_state_if_revision(
                  url, key, smoke_key, {"smoke": "stale-writer"}, revision
              )
          except StateConflictError:
              conflict_seen = True
          assert conflict_seen, "stale writer was not rejected"

          final, final_revision, _ = load_state_record(url, key, smoke_key)
          assert final_revision == 1, final_revision
          assert final.get("smoke") == "writer1", final

          production_state, production_revision, _ = load_state_record(
              url, key, prod_key
          )
          assert isinstance(production_state, dict)
          assert "history" in production_state
          print("smoke_revision", final_revision)
          print("stale_writer_rejected", conflict_seen)
          print("production_state_readable", True)
          print("production_revision", production_revision)
          PY
