name: WhatsApp template status

on:
  schedule:
    # Vérification légère toutes les heures pendant l'attente d'approbation Meta.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/check_whatsapp_templates.py"
      - ".github/workflows/whatsapp-template-status.yml"

permissions:
  contents: read

concurrency:
  group: whatsapp-template-status
  cancel-in-progress: true

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependency
        run: python -m pip install requests

      - name: Compile checker
        run: python -m py_compile scripts/check_whatsapp_templates.py

      - name: Check Meta templates
        env:
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_GRAPH_API_VERSION: "v25.0"
          WHATSAPP_TEMPLATE_WEDNESDAY: "rappel_liturgie_mercredi"
          WHATSAPP_TEMPLATE_FRIDAY: "rappel_liturgie_vendredi"
        run: python scripts/check_whatsapp_templates.py
